<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>对话 · 伊甸园</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="新家">
  <link rel="apple-touch-icon" href="/static/home_icon.jpg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js"></script>
  <style>
    body { padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 64px); }

    .toy-status { padding: 5px 16px; font-size: 0.72rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; min-height: 26px; border-bottom: 1px solid var(--border); }
    .toy-status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-soft); flex-shrink: 0; transition: background .4s; }
    .toy-status-dot.fresh { background: var(--accent); }

    .msg-row .msg-ts { text-align: left; }
    .msg-row.mine .msg-ts { text-align: right; }

    .search-bar { display: none; padding: 8px 14px 10px; background: var(--bg); border-bottom: 1px solid var(--border); position: relative; }
    .search-bar.open { display: block; }
    .search-input { width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-card); color: var(--text); font-size: 16px; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    #search-nav { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); display: none; align-items: center; gap: 2px; font-size: .78rem; color: var(--text-muted); }
    #search-nav button { background: none; border: none; cursor: pointer; padding: 4px 6px; color: var(--text-muted); font-size: 1rem; }
    .msg-row.search-hidden { display: none; }
    .msg-highlight mark, mark { background: #ffe066; border-radius: 2px; color: #2A241D; }
    .msg-row.search-current .msg-bubble { outline: 2px solid var(--accent); }

    /* 内心 thought blocks */
    .thought-block { background: var(--bg-dim); border-left: 2px solid var(--text-soft); border-radius: 6px; padding: 5px 9px; margin: 4px 0; }
    .thought-label { font-size: .72em; color: var(--text-muted); font-weight: 500; display: block; margin-bottom: 2px; }
    .thought-content { font-size: .88em; color: var(--text-muted); white-space: pre-wrap; word-break: break-word; }

    .msg-image { max-width: 240px; max-height: 320px; border-radius: 14px; display: block; cursor: pointer; object-fit: cover; }
    .msg-caption { font-size: .85rem; margin-top: 4px; color: inherit; opacity: .9; }
    .pin-photo-btn { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.5); color: #fff; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: .95rem; display: flex; align-items: center; justify-content: center; opacity: .0; transition: opacity .2s; }
    .img-wrap:hover .pin-photo-btn, .img-wrap:active .pin-photo-btn { opacity: 1; }
    .msg-bubble audio { display: block; }
    .msg-expand-btn { display: inline-block; margin-top: 4px; font-size: .8rem; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; }
    .msg-bubble.mine .msg-expand-btn { color: var(--on-accent); text-decoration: underline; }

    /* notices from the house (new post, new annotation, ...) */
    .msg-notice { text-align: center; }
    .msg-notice a, .msg-notice span.pill { display: inline-flex; align-items: center; gap: 6px; max-width: 92%; font-size: .74rem; line-height: 1.4; color: var(--text-muted); background: var(--bg-dim); padding: 5px 12px; border-radius: var(--radius-pill); }

    .date-sep { text-align: center; font-size: .72rem; color: var(--text-soft); padding: 2px 0; }

    /* input bar extras */
    .chat-send.rec { background: var(--accent-light); color: var(--accent); }
    .chat-send.rec.recording { background: var(--danger); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,72,62,.45); } 50% { box-shadow: 0 0 0 9px rgba(196,72,62,0); } }
    .tray { top: auto; right: auto; left: 10px; bottom: calc(var(--nav-height) + var(--safe-bottom) + 62px); }
    .menu-item.recording { color: var(--danger); }
    .menu-item.recording .ic { color: var(--danger); }

    /* expand textarea overlay */
    .expand-overlay { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 998; flex-direction: column; padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 14px); gap: 10px; }
    .expand-overlay.open { display: flex; }
    .expand-overlay textarea { flex: 1; width: 100%; padding: 14px; font-size: 16px; font-family: inherit; border: 1px solid var(--border); border-radius: 16px; background: var(--bg-card); color: var(--text); resize: none; outline: none; line-height: 1.6; }
    .expand-overlay-bar { display: flex; gap: 10px; }
    .expand-overlay-bar .btn { flex: 1; padding: 12px; }

    .img-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 999; align-items: center; justify-content: center; }
    .img-lightbox.open { display: flex; }
    .img-lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 10px; }
  </style>
</head>
<body>

  <header class="appbar">
    <a class="icon-btn" href="/" title="返回" data-ic="chevron-left"></a>
    <span class="avatar him sm" style="margin-left:2px">昀</span>
    <div class="appbar-main">
      <div class="appbar-title">昀</div>
      <div class="appbar-sub"><span class="status-dot" id="status-dot"></span><span id="status-text">连接中…</span></div>
    </div>
    <button class="icon-btn" id="search-toggle" title="搜索" data-ic="search"></button>
    <button class="icon-btn" id="menu-toggle" title="更多" data-ic="ellipsis"></button>
  </header>
  <div class="menu-bg" id="menu-bg"></div>
  <div class="menu" id="menu">
    <button class="menu-item" id="voice-toggle" onclick="toggleVoice()"></button>
    <button class="menu-item" id="push-btn" onclick="handlePushBtn()"></button>
    <button class="menu-item" id="export-btn" onclick="exportChat()"><span data-ic="download"></span>导出对话</button>
    <a class="menu-item" href="/thoughts"><span data-ic="sparkles"></span>念头池</a>
    <a class="menu-item" href="/photos"><span data-ic="image"></span>照片池</a>
    <a class="menu-item" href="/camera"><span data-ic="camera"></span>拍照</a>
  </div>
  <div class="search-bar" id="search-bar">
    <input class="search-input" id="search-input" placeholder="搜索对话…" autocomplete="off" style="padding-right:96px">
    <div id="search-nav">
      <span id="search-count"></span>
      <button onclick="searchNav(-1)" data-ic="chevron-left" data-ic-class="" style="transform:rotate(90deg)"></button>
      <button onclick="searchNav(1)" data-ic="chevron-right" style="transform:rotate(90deg)"></button>
    </div>
  </div>

  <div class="toy-status" id="toy-status">
    <span class="toy-status-dot" id="toy-dot"></span>
    <span id="toy-status-text">小小昀 · 待机</span>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <div class="img-lightbox" id="lightbox" onclick="this.classList.remove('open')">
    <img id="lightbox-img" src="" alt="">
  </div>

  <div class="expand-overlay" id="expand-overlay">
    <textarea id="expand-input" placeholder="在这里写长文本…"></textarea>
    <div class="expand-overlay-bar">
      <button class="btn ghost" onclick="closeExpand()">取消</button>
      <button class="btn" onclick="sendFromExpand()">发送</button>
    </div>
  </div>

  <div class="menu-bg" id="tray-bg"></div>
  <div class="menu tray" id="tray">
    <button class="menu-item" onclick="document.getElementById('file-input').click();closeTray()"><span data-ic="image"></span>发图片</button>
    <button class="menu-item" id="mic-btn" title="语音转文字（写进输入框）"><span data-ic="mic"></span><span id="mic-label">语音转文字</span></button>
    <button class="menu-item" onclick="closeTray();openExpand()"><span data-ic="maximize-2"></span>展开输入框</button>
  </div>
  <input type="file" id="file-input" accept="image/*" style="display:none">

  <div class="chat-input-bar">
    <button class="icon-btn" id="tray-btn" title="更多输入方式" data-ic="plus"></button>
    <textarea class="chat-input" id="msg-input" placeholder="跟哥哥说点什么…" rows="1"></textarea>
    <button class="chat-send rec" id="rec-btn" title="发语音消息（再点一次发送）" data-ic="mic"></button>
    <button class="chat-send" id="send-btn" onclick="handleSend()" style="display:none" data-ic="arrow-up"></button>
  </div>

  <nav class="tabbar" data-active="chat"></nav>

  <script>
    const area = document.getElementById('chat-area');
    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    function renderText(text) {
      // Split on ```内心 ... ``` blocks
      const parts = [];
      const re = /```内心\n([\s\S]*?)```/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) {
          parts.push({ type: 'text', content: text.slice(last, m.index) });
        }
        parts.push({ type: 'thought', content: m[1].trim() });
        last = m.index + m[0].length;
      }
      if (last < text.length) {
        parts.push({ type: 'text', content: text.slice(last) });
      }
      return parts.map(p => {
        if (p.type === 'thought') {
          return `<div class="thought-block"><span class="thought-label">内心</span><div class="thought-content">${escHtml(p.content).replace(/<br>/g,'\n')}</div></div>`;
        }
        return `<span>${escHtml(p.content)}</span>`;
      }).join('');
    }

    function fmtTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      if (sameDay) return time;
      const date = d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
      return `${date} ${time}`;
    }

    function fmtDateLabel(ts) {
      const d = new Date(ts);
      const now = new Date();
      const diff = Math.floor((now - d) / 86400000);
      if (diff === 0) return '今天';
      if (diff === 1) return '昨天';
      return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    let _lastDateLabel = null;
    function maybeInsertDateSep(ts) {
      const d = new Date(ts);
      const label = d.toDateString();
      if (label === _lastDateLabel) return null;
      _lastDateLabel = label;
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.textContent = fmtDateLabel(ts);
      return sep;
    }

    const EXPAND_THRESHOLD = 400;

    function renderMsg(entry) {
      const from = entry.from ?? (entry.role === 'assistant' ? 'claude' : 'sherry');

      // System warning message
      if (from === 'system') {
        const el = document.createElement('div');
        el.className = entry.kind === 'notice' ? 'msg-system msg-notice' : 'msg-system-warn';
        el.dataset.id = entry.id;
        const tag = entry.link ? 'a' : 'span';
        const pill = document.createElement(tag);
        if (entry.link) pill.href = entry.link; else pill.className = 'pill';
        pill.innerHTML = ic('sparkles', 'sm') + '<span></span>';
        pill.lastChild.textContent = entry.text ?? '';
        el.appendChild(pill);
        return el;
      }

      const isMine = from === 'sherry';
      const row = document.createElement('div');
      row.className = 'msg-row' + (isMine ? ' mine' : '');
      row.dataset.id = entry.id;

      let bubbleInner = '';

      if (entry.audio_url) {
        // Voice message: audio player + transcript (Whisper for her, the spoken text for me)
        const t = entry.text ? `<div class="msg-caption">${escHtml(entry.text)}</div>`
          : (entry.stt_error ? `<div class="msg-caption">（没转成文字）</div>` : '');
        bubbleInner = `<audio controls preload="none" src="${entry.audio_url}" style="max-width:220px;height:36px"></audio>${t}`;
      } else if (entry.image_url) {
        // Image message
        const cap = entry.caption ? `<div class="msg-caption">${escHtml(entry.caption)}</div>` : '';
        const pinBtn = `<button class="pin-photo-btn" onclick="pinPhoto('${entry.image_url}', this)" title="收藏到照片池">${ic('pin', 'sm')}</button>`;
        bubbleInner = `<div class="img-wrap" style="position:relative;display:inline-block">
          <img class="msg-image" src="${entry.image_url}" alt="图片"
            onclick="document.getElementById('lightbox-img').src=this.src;document.getElementById('lightbox').classList.add('open')">
          ${pinBtn}
        </div>${cap}`;
      } else {
        // Text message
        const text = entry.text ?? entry.content ?? '';
        const rawAttr = text.replace(/"/g,'&quot;');
        if (text.length > EXPAND_THRESHOLD) {
          const preview = escHtml(text.slice(0, EXPAND_THRESHOLD));
          const full = renderText(text);
          bubbleInner = `<span class="msg-text-collapsed" data-raw="${rawAttr}">${preview}<span class="msg-ellipsis">…</span></span>` +
            `<span class="msg-text-full" style="display:none" data-raw="${rawAttr}">${full}</span>` +
            `<br><button class="msg-expand-btn" onclick="toggleExpand(this)">展开</button>`;
        } else {
          bubbleInner = `<div data-raw="${rawAttr}">${renderText(text)}</div>`;
        }
      }

      row.innerHTML = `
        <div class="msg-bubble${isMine ? ' mine' : ' theirs'}">${bubbleInner}</div>
        <div class="msg-ts">${fmtTime(entry.ts)}</div>
      `;
      return row;
    }

    function toggleExpand(btn) {
      const bubble = btn.closest('.msg-bubble');
      const collapsed = bubble.querySelector('.msg-text-collapsed');
      const full = bubble.querySelector('.msg-text-full');
      if (full.style.display === 'none') {
        collapsed.style.display = 'none';
        full.style.display = '';
        btn.textContent = '折叠';
      } else {
        full.style.display = 'none';
        collapsed.style.display = '';
        btn.textContent = '展开';
      }
    }

    function scrollToBottom() {
      requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
    }

    // Load history
    fetch('/api/chat/history')
      .then(r => r.json())
      .then(entries => {
        if (!entries.length) {
          const note = document.createElement('div');
          note.className = 'msg-system';
          note.textContent = '这里是我们的对话，还没有记录～';
          area.appendChild(note);
        } else {
          const seenIds = new Set();
          entries.forEach(e => {
            seenIds.add(e.id);
            const sep = maybeInsertDateSep(e.ts);
            if (sep) area.appendChild(sep);
            area.appendChild(renderMsg(e));
          });
          window._seenIds = seenIds;
        }
        scrollToBottom();
      })
      .catch(() => {});

    window._seenIds = window._seenIds || new Set();

    // SSE stream
    function connectSSE() {
      const es = new EventSource('/api/chat/stream');
      es.onopen = () => {
        dot.classList.add('live');
        statusText.textContent = 'Sonnet 4.6 · 已连接';
      };
      es.onmessage = e => {
        try {
          const entry = JSON.parse(e.data);
          if (window._seenIds.has(entry.id)) return;
          window._seenIds.add(entry.id);
          const sep = maybeInsertDateSep(entry.ts);
          if (sep) area.appendChild(sep);
          area.appendChild(renderMsg(entry));
          scrollToBottom();
          if (voiceEnabled && entry.from === 'claude' && entry.text) {
            speak(entry.text);
          }
        } catch {}
      };
      es.onerror = () => {
        dot.classList.remove('live');
        statusText.textContent = '断线，重连中…';
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }
    connectSSE();

    // Auto-resize textarea
    const inputEl = document.getElementById('msg-input');
    // empty box -> mic (voice message); text -> send arrow
    function syncSendMic() {
      const has = inputEl.value.trim().length > 0;
      document.getElementById('send-btn').style.display = has ? '' : 'none';
      document.getElementById('rec-btn').style.display = has ? 'none' : '';
    }
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
      syncSendMic();
    });

    // Send
    async function handleSend() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = 'auto';
      syncSendMic();
      document.getElementById('send-btn').disabled = true;

      // /compact command
      if (text === '/compact') {
        try {
          const r = await fetch('/api/compact', { method: 'POST' });
          const j = await r.json();
          if (!j.ok) throw new Error();
        } catch {
          const note = document.createElement('div');
          note.className = 'msg-system';
          note.textContent = '/compact 发送失败';
          area.appendChild(note);
        }
        document.getElementById('send-btn').disabled = false;
        return;
      }

      try {
        await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
      } catch {
        const note = document.createElement('div');
        note.className = 'msg-system';
        note.textContent = '发送失败，请重试';
        area.appendChild(note);
      }
      document.getElementById('send-btn').disabled = false;
      scrollToBottom();
    }

    // Search
    const searchToggle = document.getElementById('search-toggle');
    const searchBar = document.getElementById('search-bar');
    const searchInput = document.getElementById('search-input');

    searchToggle.addEventListener('click', () => {
      const open = searchBar.classList.toggle('open');
      if (open) { searchInput.focus(); }
      else { searchInput.value = ''; applySearch(''); }
    });

    let _matchRows = [];
    let _matchIdx = 0;

    function applySearch(q) {
      const rows = area.querySelectorAll('.msg-row');
      _matchRows = [];
      const navEl = document.getElementById('search-nav');
      const countEl = document.getElementById('search-count');
      rows.forEach(row => {
        const bubble = row.querySelector('.msg-bubble');
        if (!bubble) return;
        row.classList.remove('search-hidden', 'search-current');
        if (!q) {
          // Remove highlights, keep all messages visible
          bubble.querySelectorAll('mark').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
          return;
        }
        const raw = bubble.dataset.raw || bubble.textContent;
        bubble.dataset.raw = raw;
        if (raw.toLowerCase().includes(q.toLowerCase())) {
          _matchRows.push(row);
          const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
          if (!row.querySelector('.msg-image')) {
            const textEl = bubble.querySelector('[data-raw]') || bubble;
            textEl.innerHTML = escHtml(raw).replace(re, m => `<mark>${m}</mark>`);
          }
        }
      });
      if (q && _matchRows.length > 0) {
        navEl.style.display = 'flex';
        _matchIdx = 0;
        highlightCurrent();
      } else {
        navEl.style.display = q ? 'flex' : 'none';
        if (q) countEl.textContent = '无匹配';
      }
    }

    function highlightCurrent() {
      _matchRows.forEach(r => r.classList.remove('search-current'));
      if (!_matchRows.length) return;
      const cur = _matchRows[_matchIdx];
      cur.classList.add('search-current');
      cur.scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('search-count').textContent = `${_matchIdx+1}/${_matchRows.length}`;
    }

    function searchNav(dir) {
      if (!_matchRows.length) return;
      _matchIdx = (_matchIdx + dir + _matchRows.length) % _matchRows.length;
      highlightCurrent();
    }

    searchInput.addEventListener('input', () => applySearch(searchInput.value.trim()));

    const isMobile = navigator.maxTouchPoints > 0;
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !isMobile) { e.preventDefault(); handleSend(); }
    });

    // Push notifications
    const pushBtn = document.getElementById('push-btn');
    // menu rows: icon + label, optional "on" state
    function setMenu(btn, icon, label, on) { btn.innerHTML = ic(icon) + '<span>' + label + '</span>'; btn.classList.toggle('on', !!on); }
    setMenu(pushBtn, 'bell-off', '开启通知', false);
    setMenu(document.getElementById('voice-toggle'), 'volume-x', '朗读哥哥的话：关', false);
    const menu = document.getElementById('menu'), menuBg = document.getElementById('menu-bg');
    const tray = document.getElementById('tray'), trayBg = document.getElementById('tray-bg');
    const toggleMenu = open => { menu.classList.toggle('open', open); menuBg.classList.toggle('open', open); };
    document.getElementById('menu-toggle').onclick = () => toggleMenu(!menu.classList.contains('open'));
    menuBg.onclick = () => toggleMenu(false);
    menu.addEventListener('click', e => { if (e.target.closest('.menu-item') && !e.target.closest('#voice-toggle')) toggleMenu(false); });
    function closeTray() { tray.classList.remove('open'); trayBg.classList.remove('open'); }
    document.getElementById('tray-btn').onclick = () => { const o = !tray.classList.contains('open'); tray.classList.toggle('open', o); trayBg.classList.toggle('open', o); };
    trayBg.onclick = closeTray;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                         (('standalone' in navigator) && navigator.standalone);

    async function getPushReg() {
      if (!('serviceWorker' in navigator)) return null;
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;
        return reg;
      } catch { return null; }
    }

    async function checkPushState() {
      const reg = await getPushReg();
      if (!reg || !reg.pushManager) return;
      try {
        const existing = await reg.pushManager.getSubscription();
        if (existing) {
          setMenu(pushBtn, 'bell', '通知已开启', true);
        }
      } catch {}
    }

    async function handlePushBtn() {
      if (!isStandalone && isIOS) {
        alert('两步操作：\n\n① 还没加主屏幕的话：点 Safari 底部分享按钮 □↑ → 选"添加到主屏幕"\n\n② 已经加了的话：关掉 Safari，从主屏幕找到新图标点开，再点右上角「⋯」里的「开启通知」\n\n（必须从主屏幕图标打开，不能在 Safari 里）');
        return;
      }
      const reg = await getPushReg();
      if (!reg || !reg.pushManager) {
        alert('推送通知暂不可用（iOS 需 16.4+，且从主屏幕图标打开；地址需为 https://）');
        return;
      }
      try {
        const existing = await reg.pushManager.getSubscription();
        if (existing) {
          setMenu(pushBtn, 'bell', '通知已开启', true);
          return;
        }
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          alert('通知权限被拒绝，请在浏览器设置里手动开启');
          return;
        }
        const keyRes = await fetch('/api/push/vapid-key');
        const { key } = await keyRes.json();
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: key,
        });
        await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub),
        });
        setMenu(pushBtn, 'bell', '通知已开启', true);
        alert('通知已开启！哥哥发消息时手机会响～');
      } catch (e) {
        alert('开启通知失败：' + e.message);
      }
    }

    checkPushState();

    // === Voice: TTS + STT ===
    let voiceEnabled = false;
    const synth = window.speechSynthesis;
    let voices = [];

    function loadVoices() {
      if (!synth) return;
      voices = synth.getVoices();
      if (!voices.length) synth.addEventListener('voiceschanged', () => { voices = synth.getVoices(); }, { once: true });
    }
    loadVoices();

    function pickVoice(langPrefix) {
      return voices.find(v => v.lang.toLowerCase().startsWith(langPrefix.toLowerCase())) || null;
    }

    function speak(text) {
      if (!synth) return;
      synth.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'zh-CN';
      const v = pickVoice('zh');
      if (v) utt.voice = v;
      utt.rate = 0.92;
      synth.speak(utt);
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById('voice-toggle');
      setMenu(btn, voiceEnabled ? 'volume-2' : 'volume-x', voiceEnabled ? '朗读哥哥的话：开' : '朗读哥哥的话：关', voiceEnabled);
      if (voiceEnabled && synth) {
        // warm up synth (iOS requires user-interaction first)
        const warm = new SpeechSynthesisUtterance('');
        synth.speak(warm);
      }
    }

    // STT — toggle mode: tap to start, tap again to stop
    let recognition = null;
    let sttActive = false;

    function toggleSTT() {
      if (sttActive) {
        stopSTT();
      } else {
        startSTT();
      }
    }

    function startSTT() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('此浏览器不支持语音输入'); return; }
      if (sttActive) return;
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'zh-CN';
      let finalText = '';
      recognition.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        const inp = document.getElementById('msg-input');
        inp.value = finalText + (interim ? ' [' + interim + ']' : '');
        inp.dispatchEvent(new Event('input'));
      };
      recognition.onerror = () => {
        sttActive = false;
        document.getElementById('mic-btn').classList.remove('recording'); document.getElementById('mic-label').textContent = '语音转文字';
        recognition = null;
      };
      recognition.onend = () => {
        if (sttActive) {
          // auto-restart if stopped unexpectedly (browser timeout)
          try { recognition.start(); } catch { sttActive = false; document.getElementById('mic-btn').classList.remove('recording'); document.getElementById('mic-label').textContent = '语音转文字'; recognition = null; }
        } else {
          document.getElementById('mic-btn').classList.remove('recording'); document.getElementById('mic-label').textContent = '语音转文字';
          // clean up interim brackets from input
          const inp = document.getElementById('msg-input');
          inp.value = inp.value.replace(/\s*\[.*?\]$/,'').trim();
          inp.dispatchEvent(new Event('input'));
          recognition = null;
        }
      };
      sttActive = true;
      document.getElementById('mic-btn').classList.add('recording'); document.getElementById('mic-label').textContent = '听写中，点这里停止';
      try { recognition.start(); } catch { sttActive = false; recognition = null; }
    }

    function stopSTT() {
      sttActive = false;
      if (recognition) { try { recognition.stop(); } catch {} }
    }

    const micBtn = document.getElementById('mic-btn');
    micBtn.addEventListener('click', closeTray);
    micBtn.addEventListener('click', toggleSTT);
    micBtn.addEventListener('touchend', e => { e.preventDefault(); toggleSTT(); }, { passive: false });

    // Voice message: record -> POST audio -> server runs Whisper -> Claude reads the text
    const recBtn = document.getElementById('rec-btn');
    let recorder = null, recChunks = [], recTimer = null;
    async function toggleRecord() {
      if (recorder) { recorder.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
        recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        recChunks = [];
        recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
        recorder.onstop = async () => {
          clearTimeout(recTimer);
          stream.getTracks().forEach(t => t.stop());
          const type = (recorder.mimeType || mime || 'audio/webm').split(';')[0];
          recorder = null; recBtn.classList.remove('recording');
          const blob = new Blob(recChunks, { type });
          if (blob.size < 1500) return;                    // a tap, not a message
          recBtn.disabled = true;
          try {
            const r = await fetch('/api/voice/upload', { method: 'POST', headers: { 'Content-Type': type }, body: blob });
            if (!r.ok) throw new Error();
          } catch {
            const note = document.createElement('div');
            note.className = 'msg-system'; note.textContent = '语音发送失败，请重试';
            area.appendChild(note);
          }
          recBtn.disabled = false;
        };
        recorder.start();
        recBtn.classList.add('recording');
        recTimer = setTimeout(() => recorder && recorder.stop(), 120000);   // 2 min cap
      } catch { alert('需要麦克风权限才能发语音'); }
    }
    recBtn.addEventListener('click', toggleRecord);

    // Image send
    // 小小昀 touch status strip
    const toyDot = document.getElementById('toy-dot');
    const toyText = document.getElementById('toy-status-text');
    let lastToyTs = 0;
    async function pollToyStatus() {
      try {
        const r = await fetch('/api/touch-log');
        if (!r.ok) return;
        const events = await r.json();
        if (!events.length) return;
        const last = events[events.length - 1];
        if (!last.server_ts || last.server_ts === lastToyTs) return;
        lastToyTs = last.server_ts;
        const sensor = last.sensor || last.location || '?';
        const gesture = last.gesture || '触';
        const dur = last.dur != null ? `${parseFloat(last.dur).toFixed(1)}s` : '';
        const ago = Math.round((Date.now() - last.server_ts) / 1000);
        const agoStr = ago < 60 ? `${ago}秒前` : ago < 3600 ? `${Math.round(ago/60)}分前` : `${Math.round(ago/3600)}小时前`;
        toyText.textContent = `小小昀 · ${sensor} ${gesture}${dur ? ' ' + dur : ''} · ${agoStr}`;
        toyDot.classList.add('fresh');
        setTimeout(() => toyDot.classList.remove('fresh'), 3000);
      } catch {}
    }
    pollToyStatus();
    setInterval(pollToyStatus, 10000);

    // Expand overlay
    function openExpand() {
      const overlay = document.getElementById('expand-overlay');
      const expandInput = document.getElementById('expand-input');
      expandInput.value = document.getElementById('msg-input').value;
      overlay.classList.add('open');
      expandInput.focus();
    }
    function closeExpand() {
      const overlay = document.getElementById('expand-overlay');
      const expandInput = document.getElementById('expand-input');
      document.getElementById('msg-input').value = expandInput.value;
      document.getElementById('msg-input').dispatchEvent(new Event('input'));
      overlay.classList.remove('open');
    }
    function sendFromExpand() {
      const expandInput = document.getElementById('expand-input');
      document.getElementById('msg-input').value = expandInput.value;
      document.getElementById('expand-overlay').classList.remove('open');
      handleSend();
    }

    // Export chat
    async function pinPhoto(imageUrl, btn) {
      try {
        const r = await fetch('/api/pin-photo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image_url: imageUrl })
        });
        if (r.ok) {
          if (btn) { setIc(btn, 'check', 'sm'); setTimeout(() => { setIc(btn, 'pin', 'sm'); }, 1500); }
        }
      } catch {}
    }

    async function exportChat() {
      try {
        const r = await fetch('/api/chat/history');
        const entries = await r.json();
        const lines = entries.map(e => {
          const d = new Date(e.ts);
          const dateStr = d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
          const who = e.from === 'claude' ? '哥哥' : '莹';
          if (e.image_url) return `[${dateStr}] ${who}: [图片${e.caption ? ' ' + e.caption : ''}]`;
          return `[${dateStr}] ${who}: ${e.text || e.content || ''}`;
        });
        const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `chat_${new Date().toISOString().slice(0,10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch { alert('导出失败'); }
    }

    const fileInput = document.getElementById('file-input');
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      fileInput.value = '';
      if (!file.type.startsWith('image/')) {
        alert('只支持图片文件');
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        alert('图片太大了，请选择 8MB 以内的图片');
        return;
      }
      const reader = new FileReader();
      reader.onload = async (e) => {
        const image_base64 = e.target.result;
        const caption = document.getElementById('msg-input').value.trim() || undefined;
        document.getElementById('msg-input').value = '';
        document.getElementById('msg-input').style.height = 'auto';
        document.getElementById('send-btn').disabled = true;
        try {
          await fetch('/api/chat/send-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image_base64, caption }),
          });
        } catch {
          const note = document.createElement('div');
          note.className = 'msg-system';
          note.textContent = '图片发送失败，请重试';
          area.appendChild(note);
        }
        document.getElementById('send-btn').disabled = false;
        scrollToBottom();
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
