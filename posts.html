<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>朋友圈 · 伊甸园</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>
<style>
  .compose { display: flex; gap: 12px; align-items: flex-start; }
  .compose textarea { flex: 1; border: none; background: none; resize: none; outline: none; font: inherit; font-size: 16px; color: var(--text); line-height: 1.6; min-height: 64px; padding: 6px 0; }
  .compose textarea::placeholder { color: var(--text-soft); }
  .compose-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border); }
  .compose-note { font-size: .74rem; color: var(--text-soft); }

  .post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-name { font-size: .88rem; font-weight: 600; }
  .post-time { font-size: .72rem; color: var(--text-soft); }
  .post-text { font-size: .96rem; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .post-image { width: 100%; max-width: 320px; border-radius: 14px; margin-top: 10px; display: block; }

  .comments { margin-top: 12px; background: var(--bg); border-radius: 14px; padding: 4px 12px; }
  .comment { display: flex; gap: 8px; padding: 8px 0; font-size: .86rem; line-height: 1.55; border-bottom: 1px solid var(--border); }
  .comment-name { font-weight: 600; flex: none; }
  .comment-name.me { color: var(--him); }
  .comment-name.sherry { color: var(--accent-dim); }
  .comment-text { word-break: break-word; }
  .comment-form { display: flex; gap: 8px; padding: 8px 0; align-items: center; }
  .comment-input { flex: 1; min-width: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-pill); color: var(--text); font: inherit; font-size: 16px; padding: 7px 14px; outline: none; }
  .comment-input:focus { border-color: var(--accent); }
  .comment-btn { border: none; background: var(--accent-light); color: var(--accent-dim); border-radius: var(--radius-pill); padding: 8px 14px; font-size: .8rem; font-weight: 600; cursor: pointer; }
  .comment-btn:disabled { opacity: .5; }
  .status { text-align: center; font-size: .72rem; color: var(--text-soft); padding: 4px 0 8px; }
</style>
</head>
<body>
<div class="page-header">
  <div class="page-title">朋友圈</div>
  <div class="page-subtitle">我们各自的墙，互相看见</div>
</div>

<div class="scroll-area">
  <div class="card">
    <div class="compose">
      <span class="avatar her">莹</span>
      <textarea id="compose-text" placeholder="说点什么…" rows="2"></textarea>
    </div>
    <div class="compose-foot">
      <span class="compose-note">以莹的身份发</span>
      <button class="btn sm" id="post-btn" onclick="submitPost()"><span data-ic="send" data-ic-class="sm"></span>发出去</button>
    </div>
  </div>

  <div id="feed"><div class="empty">加载中…</div></div>
  <div class="status" id="status-bar"></div>
</div>

<nav class="tabbar" data-active="moments"></nav>

<script>
const ME_NAMES = { me: '昀', sherry: '莹' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function reltime(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d/60000) + ' 分钟前';
  if (d < 86400000) return Math.floor(d/3600000) + ' 小时前';
  const dt = new Date(ts);
  return `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function renderPost(post) {
  const who = post.from === 'me' ? 'me' : 'sherry';
  const name = ME_NAMES[post.from] || post.from;
  const comments = (post.comments || []).map(c => {
    const cw = c.from === 'me' ? 'me' : 'sherry';
    return `<div class="comment"><span class="comment-name ${cw}">${esc(ME_NAMES[c.from] || c.from)}</span><span class="comment-text">${esc(c.text)}</span></div>`;
  }).join('');
  const imgHtml = post.image ? `<img class="post-image" src="${esc(post.image)}" alt="">` : '';
  return `<div class="card" data-id="${esc(post.id)}">
    <div class="post-head">
      <span class="avatar ${who === 'me' ? 'him' : 'her'}">${esc(name[0])}</span>
      <div><div class="post-name">${esc(name)}</div><div class="post-time">${reltime(post.ts)}</div></div>
    </div>
    <div class="post-text">${esc(post.text)}</div>
    ${imgHtml}
    <div class="comments">
      ${comments}
      <div class="comment-form">
        <input class="comment-input" placeholder="留个言…" onkeydown="if(event.key==='Enter'){addComment('${esc(post.id)}',this)}">
        <button class="comment-btn" onclick="addComment('${esc(post.id)}',this.previousElementSibling)">留言</button>
      </div>
    </div>
  </div>`;
}

// the feed refreshes itself; don't wipe a half-typed comment when it does
const typing = () => { const a = document.activeElement; return a && a.matches && a.matches('.comment-input, #compose-text') && a.value; };

async function loadPosts(force) {
  if (!force && typing()) return;
  try {
    const r = await fetch('/api/posts');
    const { posts } = await r.json();
    const feed = document.getElementById('feed');
    if (!posts || posts.length === 0) {
      feed.innerHTML = '<div class="empty">还没有内容，先来一条？</div>';
      return;
    }
    feed.innerHTML = posts.map(renderPost).join('');
    document.getElementById('status-bar').textContent = `共 ${posts.length} 条`;
  } catch(e) {
    document.getElementById('feed').innerHTML = '<div class="empty">加载失败</div>';
  }
}

async function submitPost() {
  const textarea = document.getElementById('compose-text');
  const text = textarea.value.trim();
  if (!text) return;
  const btn = document.getElementById('post-btn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, from: 'sherry' })
    });
    if (r.ok) { textarea.value = ''; await loadPosts(true); }
  } finally { btn.disabled = false; }
}

async function addComment(postId, input) {
  const text = input.value.trim();
  if (!text) return;
  input.disabled = true;
  try {
    const r = await fetch('/api/posts/comment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ post_id: postId, from: 'sherry', text })
    });
    if (r.ok) { input.value = ''; await loadPosts(true); }
  } finally { input.disabled = false; }
}

loadPosts(true);
setInterval(loadPosts, 30000);
// live: a new post/comment from 昀 shows up without waiting for the poll
(function live() {
  const es = new EventSource('/api/events');
  es.onmessage = m => { try { const e = JSON.parse(m.data); if (e.type === '朋友圈' && e.actor !== 'sherry') loadPosts(); } catch {} };
  es.onerror = () => { es.close(); setTimeout(live, 3000); };
})();
</script>
</body>
</html>
