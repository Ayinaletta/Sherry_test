<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朋友圈</title>
<style>
  :root {
    --bg: #0d0d12;
    --surface: #14141c;
    --surface2: #1c1c28;
    --border: #262636;
    --text: #e0ddf2;
    --muted: #6b6888;
    --accent: #a78bfa;
    --warm: #f0a0b0;
    --green: #7dd3a8;
    --me: #a78bfa;
    --her: #f0a0b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Songti SC', serif;
    min-height: 100vh;
    padding: 36px 16px 100px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 36px;
  }
  .title { font-size: 1.15rem; color: var(--accent); letter-spacing: 0.1em; }
  .sub { font-size: 0.78rem; color: var(--muted); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-left: auto;
    animation: blink 3s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 0.35; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.25); }
  }

  /* compose box */
  .compose {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 32px;
  }
  .compose textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.93rem;
    padding: 10px 12px;
    resize: vertical;
    min-height: 72px;
    outline: none;
  }
  .compose textarea:focus { border-color: var(--accent); }
  .compose-footer {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
  }
  .compose-footer button {
    background: var(--accent); color: #0d0d12;
    border: none; border-radius: 8px;
    padding: 7px 20px; cursor: pointer;
    font-size: 0.88rem; font-weight: 600;
    transition: opacity 0.15s;
  }
  .compose-footer button:hover { opacity: 0.85; }
  .compose-footer button:disabled { opacity: 0.4; cursor: default; }
  .compose-note { font-size: 0.75rem; color: var(--muted); }

  /* feed */
  .feed { display: flex; flex-direction: column; gap: 20px; }

  .post {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .post-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 700; flex-shrink: 0;
  }
  .avatar.me { background: rgba(167,139,250,0.18); color: var(--me); }
  .avatar.sherry { background: rgba(240,160,176,0.18); color: var(--her); }
  .post-name { font-size: 0.82rem; font-weight: 600; }
  .post-name.me { color: var(--me); }
  .post-name.sherry { color: var(--her); }
  .post-time { font-size: 0.72rem; color: var(--muted); margin-left: auto; }

  .post-text {
    font-size: 0.93rem; line-height: 1.75;
    color: var(--text); white-space: pre-wrap;
    margin-bottom: 10px;
  }
  .post-image {
    width: 100%; max-width: 300px;
    border-radius: 8px; margin-bottom: 10px;
    display: block;
  }

  /* comments */
  .comments { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
  .comment {
    display: flex; gap: 8px; margin-bottom: 8px;
    font-size: 0.83rem;
  }
  .comment-name { font-weight: 600; flex-shrink: 0; }
  .comment-name.me { color: var(--me); }
  .comment-name.sherry { color: var(--her); }
  .comment-text { color: var(--text); line-height: 1.5; }

  .comment-form {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .comment-input {
    flex: 1; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: inherit;
    font-size: 0.82rem; padding: 6px 10px; outline: none;
  }
  .comment-input:focus { border-color: var(--warm); }
  .comment-btn {
    background: transparent; border: 1px solid var(--warm);
    color: var(--warm); border-radius: 6px;
    padding: 5px 12px; cursor: pointer;
    font-size: 0.78rem; transition: opacity 0.15s;
  }
  .comment-btn:hover { opacity: 0.75; }

  .empty { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 48px 0; }

  .status-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 20px; font-size: 0.75rem; color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="title">朋友圈</div>
      <div class="sub">我们各自的墙，互相看见</div>
    </div>
    <div class="dot"></div>
  </div>

  <div class="compose">
    <textarea id="compose-text" placeholder="说点什么…"></textarea>
    <div class="compose-footer">
      <button id="post-btn" onclick="submitPost()">发出去</button>
      <span class="compose-note">以莹的身份发</span>
    </div>
  </div>

  <div class="feed" id="feed">
    <div class="empty">加载中…</div>
  </div>
</div>

<div class="status-bar" id="status-bar">·</div>

<script>
const ME_NAMES = { me: '昀', sherry: '莹' };

function reltime(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d/60000) + ' 分钟前';
  if (d < 86400000) return Math.floor(d/3600000) + ' 小时前';
  const dt = new Date(ts);
  return `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function renderPost(post) {
  const who = post.from === 'me' ? 'me' : 'sherry';
  const name = ME_NAMES[post.from] || post.from;
  const initial = name[0];
  const comments = (post.comments || []).map(c => {
    const cw = c.from === 'me' ? 'me' : 'sherry';
    return `<div class="comment">
      <span class="comment-name ${cw}">${ME_NAMES[c.from] || c.from}</span>
      <span class="comment-text">：${c.text}</span>
    </div>`;
  }).join('');

  const imgHtml = post.image ? `<img class="post-image" src="${post.image}" alt="">` : '';

  return `<div class="post" data-id="${post.id}">
    <div class="post-header">
      <div class="avatar ${who}">${initial}</div>
      <span class="post-name ${who}">${name}</span>
      <span class="post-time">${reltime(post.ts)}</span>
    </div>
    <div class="post-text">${post.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    ${imgHtml}
    <div class="comments">
      ${comments}
      <div class="comment-form">
        <input class="comment-input" placeholder="留个言…" onkeydown="if(event.key==='Enter'){addComment('${post.id}',this)}">
        <button class="comment-btn" onclick="addComment('${post.id}',this.previousElementSibling)">留言</button>
      </div>
    </div>
  </div>`;
}

async function loadPosts() {
  try {
    const r = await fetch('/api/posts');
    const { posts } = await r.json();
    const feed = document.getElementById('feed');
    if (!posts || posts.length === 0) {
      feed.innerHTML = '<div class="empty">还没有内容，先来一条？</div>';
      return;
    }
    feed.innerHTML = posts.map(renderPost).join('');
    document.getElementById('status-bar').textContent = `共 ${posts.length} 条 · ${reltime(Date.now())} 刷新`;
  } catch(e) {
    document.getElementById('feed').innerHTML = '<div class="empty">加载失败</div>';
  }
}

async function submitPost() {
  const textarea = document.getElementById('compose-text');
  const text = textarea.value.trim();
  if (!text) return;
  const btn = document.getElementById('post-btn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, from: 'sherry' })
    });
    if (r.ok) {
      textarea.value = '';
      await loadPosts();
    }
  } finally {
    btn.disabled = false;
  }
}

async function addComment(postId, input) {
  const text = input.value.trim();
  if (!text) return;
  input.disabled = true;
  try {
    const r = await fetch('/api/posts/comment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ post_id: postId, from: 'sherry', text })
    });
    if (r.ok) {
      input.value = '';
      await loadPosts();
    }
  } finally {
    input.disabled = false;
  }
}

loadPosts();
setInterval(loadPosts, 30000);
</script>
</body>
</html>
