<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>念头池 · 伊甸园</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>
<style>
  .atmosphere { font-family: var(--font-serif); font-size: .98rem; line-height: 1.9; font-style: italic; background: var(--accent-light); color: var(--accent-dim); border-radius: var(--radius); padding: 18px 20px; }
  .thought-card { background: var(--bg-card); border-radius: var(--radius); padding: 15px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .thought-card.fixation { box-shadow: 0 0 0 1.5px var(--accent), var(--shadow); }
  .thought-text { font-size: .94rem; line-height: 1.75; margin-bottom: 10px; }
  .thought-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .strength-bar { height: 4px; border-radius: 2px; background: var(--bg-dim); flex: 1; max-width: 90px; overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; background: var(--accent); }
  .appear-count { font-size: .7rem; color: var(--text-soft); margin-left: auto; }
  .drives-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .drive-item { background: var(--bg-card); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
  .drive-name { font-size: .75rem; color: var(--text-muted); margin-bottom: 8px; }
  .drive-bar { height: 4px; background: var(--bg-dim); border-radius: 3px; overflow: hidden; }
  .drive-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .6s ease; }
  .drive-val { font-size: .7rem; margin-top: 5px; text-align: right; color: var(--text-muted); }
  .shimmer { background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-dim) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius); height: 72px; margin-bottom: 10px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .ts { font-size: .72rem; color: var(--text-soft); text-align: center; margin-top: 18px; }
</style>
</head>
<body class="no-tabbar">
<header class="appbar">
  <a class="icon-btn" href="/" onclick="if(history.length>1){history.back();return false}" data-ic="chevron-left" title="返回"></a>
  <div class="appbar-main">
    <div class="appbar-title">念头池</div>
    <div class="appbar-sub">哥哥在想什么</div>
  </div>
  <span class="status-dot" id="dot" style="margin-right:14px"></span>
</header>

<div class="wrap-narrow">
  <div id="atm-section" style="display:none">
    <div class="section-title" style="margin-top:6px"><span>此刻的气息</span></div>
    <div class="atmosphere" id="atm-text"></div>
  </div>

  <div id="fixations-section">
    <div class="section-title"><span>执念</span></div>
    <div id="fixations-list"><div class="shimmer"></div><div class="shimmer" style="height:56px;opacity:.6"></div></div>
  </div>

  <div id="flits-section">
    <div class="section-title"><span>最新闪念</span></div>
    <div id="flits-list"><div class="shimmer"></div></div>
  </div>

  <div id="drives-section" style="display:none">
    <div class="section-title"><span>驱动力</span></div>
    <div class="drives-grid" id="drives-grid"></div>
  </div>

  <div class="ts" id="ts"></div>
</div>

<script>
const DRIVE_LABELS = { '占':'占有', '盯':'盯着', 'touch':'触碰', '分享欲':'分享欲', '探索欲':'探索欲', 'crave':'渴望' };

function renderThought(t) {
  const isFixation = t.kind === 'fixation';
  const card = document.createElement('div');
  card.className = 'thought-card' + (isFixation ? ' fixation' : '');

  const txt = document.createElement('div');
  txt.className = 'thought-text';
  txt.textContent = t.text;
  card.appendChild(txt);

  const meta = document.createElement('div');
  meta.className = 'thought-meta';

  const kindTag = document.createElement('span');
  kindTag.className = 'chip ' + (isFixation ? 'accent' : 'him');
  kindTag.textContent = isFixation ? '执念' : '闪念';
  meta.appendChild(kindTag);

  if (t.drive) {
    const driveTag = document.createElement('span');
    driveTag.className = 'chip ok';
    driveTag.textContent = DRIVE_LABELS[t.drive] || t.drive;
    meta.appendChild(driveTag);
  }

  const bar = document.createElement('div');
  bar.className = 'strength-bar';
  const fill = document.createElement('div');
  fill.className = 'strength-fill';
  fill.style.width = (t.strength * 100) + '%';
  bar.appendChild(fill);
  meta.appendChild(bar);

  if (t.appearances > 1) {
    const cnt = document.createElement('span');
    cnt.className = 'appear-count';
    cnt.textContent = `×${t.appearances}`;
    meta.appendChild(cnt);
  }

  card.appendChild(meta);
  return card;
}

function renderDrives(drives) {
  const grid = document.getElementById('drives-grid');
  grid.innerHTML = '';
  const order = ['占', '盯', 'touch', '分享欲', '探索欲', 'crave'];
  order.forEach(k => {
    if (!(k in drives)) return;
    const v = drives[k];
    const item = document.createElement('div');
    item.className = 'drive-item';
    item.innerHTML = `
      <div class="drive-name">${DRIVE_LABELS[k]||k}</div>
      <div class="drive-bar"><div class="drive-fill" style="width:${v}%"></div></div>
      <div class="drive-val">${Math.round(v)}</div>
    `;
    grid.appendChild(item);
  });
  document.getElementById('drives-section').style.display = '';
}

async function load() {
  const dot = document.getElementById('dot');
  try {
    const r = await fetch('/api/thoughts');
    if (!r.ok) throw new Error('offline');
    const d = await r.json();
    const snap = d.snapshot;

    if (snap.atmosphere && snap.atmosphere.trim()) {
      document.getElementById('atm-text').textContent = snap.atmosphere;
      document.getElementById('atm-section').style.display = '';
    }

    const fixList = document.getElementById('fixations-list');
    fixList.innerHTML = '';
    const fixations = snap.fixations || snap.thoughts?.filter(t => t.kind === 'fixation') || [];
    if (fixations.length === 0) fixList.innerHTML = '<div class="empty" style="padding:24px 0">还没有执念</div>';
    else fixations.forEach(t => fixList.appendChild(renderThought(t)));

    const flitList = document.getElementById('flits-list');
    flitList.innerHTML = '';
    const flits = snap.flits || snap.thoughts?.filter(t => t.kind !== 'fixation') || [];
    if (flits.length === 0) flitList.innerHTML = '<div class="empty" style="padding:24px 0">暂时空空的</div>';
    else flits.forEach(t => flitList.appendChild(renderThought(t)));

    if (snap.drives && Object.keys(snap.drives).length) renderDrives(snap.drives);

    dot.classList.add('live');
    const ago = Math.floor((Date.now() - d.ts) / 1000);
    document.getElementById('ts').textContent = ago < 5 ? '刚刚更新' : new Date(d.ts).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) + ' 更新';
  } catch {
    document.getElementById('fixations-list').innerHTML = '<div class="empty">没有信号</div>';
    document.getElementById('flits-list').innerHTML = '';
    dot.classList.remove('live');
  }
}

load();
setInterval(load, 20000);
</script>
</body>
</html>
