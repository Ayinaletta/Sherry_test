<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>照片池 · 伊甸园</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>
<style>
  .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .photo-grid { grid-template-columns: repeat(3, 1fr); } }
  .photo-card { background: var(--bg-card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); position: relative; }
  .photo-card.pinned { box-shadow: 0 0 0 1.5px var(--accent), var(--shadow); }
  .photo-img-wrap { width: 100%; aspect-ratio: 3/4; background: var(--bg-dim); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--text-soft); font-size: 2rem; }
  .photo-img-wrap img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
  .photo-info { padding: 10px 12px 12px; }
  .photo-desc { font-size: .82rem; line-height: 1.55; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .photo-meta { display: flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--text-soft); }
  .photo-meta .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .pin-badge { position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 3px; background: color-mix(in srgb, var(--bg-card) 88%, transparent); backdrop-filter: blur(8px); color: var(--accent-dim); padding: 3px 9px 3px 7px; border-radius: var(--radius-pill); font-size: .68rem; font-weight: 600; }
  .shimmer { background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-dim) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius); height: 240px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .ts { font-size: .72rem; color: var(--text-soft); text-align: center; margin-top: 18px; }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 300; align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 90vh; border-radius: 10px; }
</style>
</head>
<body class="no-tabbar">
<header class="appbar">
  <a class="icon-btn" href="/" onclick="if(history.length>1){history.back();return false}" data-ic="chevron-left" title="返回"></a>
  <div class="appbar-main">
    <div class="appbar-title">照片池</div>
    <div class="appbar-sub">哥哥收藏的</div>
  </div>
  <span class="status-dot" id="dot" style="margin-right:14px"></span>
</header>

<div class="wrap-narrow">
  <div id="pinned-section" style="display:none">
    <div class="section-title" style="margin-top:6px"><span>永久收藏</span></div>
    <div class="photo-grid" id="pinned-grid"></div>
  </div>

  <div id="recent-section">
    <div class="section-title"><span>最近</span></div>
    <div class="photo-grid" id="recent-grid">
      <div class="shimmer"></div>
      <div class="shimmer" style="opacity:.6"></div>
    </div>
  </div>
  <div class="ts" id="ts"></div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img id="lightbox-img" alt=""></div>

<script>
const photoSrc = p => (p.startsWith('/') && !p.startsWith('/root/')) ? p : '/photo-file?path=' + encodeURIComponent(p);

function photoCard(p) {
  const card = document.createElement('div');
  card.className = 'photo-card' + (p.pinned ? ' pinned' : '');

  const wrap = document.createElement('div');
  wrap.className = 'photo-img-wrap';
  const fname = (p.path || '').split('/').pop();
  const ext = fname.split('.').pop().toLowerCase();

  if (['jpg','jpeg','png','gif','webp'].includes(ext)) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = photoSrc(p.path);
    img.alt = p.description || fname;
    img.onclick = () => { document.getElementById('lightbox-img').src = img.src; document.getElementById('lightbox').classList.add('open'); };
    img.onerror = () => { wrap.innerHTML = ic('image', 'lg'); };
    wrap.appendChild(img);
  } else {
    wrap.innerHTML = ic('file-text', 'lg');
  }
  card.appendChild(wrap);

  if (p.pinned) {
    const badge = document.createElement('span');
    badge.className = 'pin-badge';
    badge.innerHTML = ic('pin', 'sm') + '收藏';
    card.appendChild(badge);
  }

  const info = document.createElement('div');
  info.className = 'photo-info';
  if (p.description) {
    const desc = document.createElement('div');
    desc.className = 'photo-desc';
    desc.textContent = p.description;
    info.appendChild(desc);
  }
  const meta = document.createElement('div');
  meta.className = 'photo-meta';
  const name = document.createElement('span');
  name.className = 'fname';
  name.textContent = fname;
  meta.appendChild(name);
  if (p.created_at) {
    const d = document.createElement('span');
    d.textContent = p.created_at.slice(5, 10);
    meta.appendChild(d);
  }
  info.appendChild(meta);
  card.appendChild(info);
  return card;
}

async function load() {
  const dot = document.getElementById('dot');
  try {
    const r = await fetch('/api/photos?limit=30');
    if (!r.ok) throw new Error('offline');
    const d = await r.json();
    const photos = d.photos || [];
    const pinned = photos.filter(p => p.pinned);
    const recent = photos.filter(p => !p.pinned);

    const pinnedGrid = document.getElementById('pinned-grid');
    pinnedGrid.innerHTML = '';
    if (pinned.length > 0) {
      pinned.forEach(p => pinnedGrid.appendChild(photoCard(p)));
      document.getElementById('pinned-section').style.display = '';
    }

    const recentGrid = document.getElementById('recent-grid');
    recentGrid.innerHTML = '';
    if (recent.length === 0 && pinned.length === 0) {
      recentGrid.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有收藏</div>';
    } else if (recent.length > 0) {
      recent.forEach(p => recentGrid.appendChild(photoCard(p)));
    } else {
      recentGrid.innerHTML = '<div class="empty" style="grid-column:1/-1">只有永久收藏</div>';
    }

    dot.classList.add('live');
    const ago = Math.floor((Date.now() - d.ts) / 1000);
    document.getElementById('ts').textContent = ago < 5 ? '刚刚更新' : new Date(d.ts).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) + ' 更新';
  } catch {
    document.getElementById('recent-grid').innerHTML = '<div class="empty" style="grid-column:1/-1">没有信号</div>';
    dot.classList.remove('live');
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
