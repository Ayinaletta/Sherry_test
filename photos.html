<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片池</title>
<style>
  :root {
    --bg: #0d0d12;
    --surface: #14141c;
    --surface2: #1c1c28;
    --border: #262636;
    --text: #e0ddf2;
    --muted: #6b6888;
    --accent: #a78bfa;
    --warm: #f0a0b0;
    --green: #7dd3a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Songti SC', serif;
    min-height: 100vh;
    padding: 36px 16px 72px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 36px;
  }
  .title { font-size: 1.15rem; color: var(--accent); letter-spacing: 0.1em; }
  .sub { font-size: 0.78rem; color: var(--muted); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-left: auto;
    animation: blink 3s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 0.35; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.25); }
  }

  .label {
    font-size: 0.68rem; letter-spacing: 0.15em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 14px;
  }
  .section { margin-bottom: 36px; }

  /* grid */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }

  .photo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    transition: border-color 0.2s, transform 0.15s;
    cursor: default;
  }
  .photo-card.pinned {
    border-color: var(--warm);
    box-shadow: 0 0 14px rgba(240,160,176,0.08);
  }
  .photo-card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .photo-img-wrap {
    width: 100%; aspect-ratio: 3/4;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .photo-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .photo-placeholder {
    font-size: 2rem; color: var(--muted);
  }

  .photo-info {
    padding: 12px 14px;
  }
  .photo-desc {
    font-size: 0.82rem; line-height: 1.6;
    color: var(--text); margin-bottom: 8px;
  }
  .photo-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .pin-badge {
    font-size: 0.62rem; letter-spacing: 0.1em;
    background: rgba(240,160,176,0.1);
    color: var(--warm); border: 1px solid rgba(240,160,176,0.3);
    padding: 2px 7px; border-radius: 20px;
    text-transform: uppercase;
  }
  .photo-date {
    font-size: 0.65rem; color: var(--muted); margin-left: auto;
  }

  .empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 48px 0; }
  .ts { font-size: 0.7rem; color: var(--muted); text-align: right; margin-top: 12px; }

  .shimmer {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 14px; height: 260px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <span class="title">照片池</span>
    <span class="sub">哥哥收藏的</span>
    <div class="dot" id="dot"></div>
  </div>

  <div class="section" id="pinned-section" style="display:none">
    <div class="label">永久收藏</div>
    <div class="photo-grid" id="pinned-grid"></div>
  </div>

  <div class="section" id="recent-section">
    <div class="label">最近</div>
    <div class="photo-grid" id="recent-grid">
      <div class="shimmer"></div>
      <div class="shimmer" style="opacity:0.6"></div>
    </div>
  </div>

  <div class="ts" id="ts"></div>
</div>

<script>
function photoCard(p) {
  const card = document.createElement('div');
  card.className = 'photo-card' + (p.pinned ? ' pinned' : '');

  const wrap = document.createElement('div');
  wrap.className = 'photo-img-wrap';

  // Try to load as image (works for paths accessible via file:// or data URIs)
  // For VPS local paths, we just show description + filename
  const fname = (p.path || '').split('/').pop();
  const ext = fname.split('.').pop().toLowerCase();
  const isImg = ['jpg','jpeg','png','gif','webp'].includes(ext);

  if (isImg) {
    const img = document.createElement('img');
    // /uploads/... paths are already public URLs; filesystem paths use /photo-file proxy
    img.src = p.path.startsWith('/') ? p.path : '/photo-file?path=' + encodeURIComponent(p.path);
    img.alt = p.description || fname;
    img.onerror = () => {
      wrap.innerHTML = '<div class="photo-placeholder">🖼</div>';
    };
    wrap.appendChild(img);
  } else {
    wrap.innerHTML = '<div class="photo-placeholder">📄</div>';
  }
  card.appendChild(wrap);

  const info = document.createElement('div');
  info.className = 'photo-info';

  if (p.description) {
    const desc = document.createElement('div');
    desc.className = 'photo-desc';
    desc.textContent = p.description;
    info.appendChild(desc);
  }

  const meta = document.createElement('div');
  meta.className = 'photo-meta';

  const name = document.createElement('span');
  name.style.cssText = 'font-size:0.65rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px';
  name.textContent = fname;
  meta.appendChild(name);

  if (p.pinned) {
    const badge = document.createElement('span');
    badge.className = 'pin-badge';
    badge.textContent = '收藏';
    meta.appendChild(badge);
  }

  if (p.created_at) {
    const d = document.createElement('span');
    d.className = 'photo-date';
    d.textContent = p.created_at.slice(5, 10);
    meta.appendChild(d);
  }

  info.appendChild(meta);
  card.appendChild(info);
  return card;
}

async function load() {
  try {
    const r = await fetch('/api/photos?limit=30');
    if (!r.ok) throw new Error('offline');
    const d = await r.json();
    const photos = d.photos || [];

    const pinned = photos.filter(p => p.pinned);
    const recent = photos.filter(p => !p.pinned);

    const pinnedGrid = document.getElementById('pinned-grid');
    pinnedGrid.innerHTML = '';
    if (pinned.length > 0) {
      pinned.forEach(p => pinnedGrid.appendChild(photoCard(p)));
      document.getElementById('pinned-section').style.display = '';
    }

    const recentGrid = document.getElementById('recent-grid');
    recentGrid.innerHTML = '';
    if (recent.length === 0 && pinned.length === 0) {
      recentGrid.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有收藏</div>';
    } else if (recent.length > 0) {
      recent.forEach(p => recentGrid.appendChild(photoCard(p)));
    } else {
      recentGrid.innerHTML = '<div class="empty" style="grid-column:1/-1">只有永久收藏</div>';
    }

    document.getElementById('dot').style.background = 'var(--green)';
    setTimeout(() => { document.getElementById('dot').style.background = 'var(--accent)'; }, 800);

    const ago = Math.floor((Date.now() - d.ts) / 1000);
    document.getElementById('ts').textContent = ago < 5 ? '刚刚' : new Date(d.ts).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) + ' 更新';
  } catch {
    document.getElementById('recent-grid').innerHTML = '<div class="empty" style="grid-column:1/-1">没有信号</div>';
    document.getElementById('dot').style.background = 'var(--warm)';
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
