<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拍莹 · 伊甸园</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>
<style>
  .channels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .channel-card { background: var(--bg-card); border-radius: var(--radius); padding: 26px 14px 20px; text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s; }
  .channel-card:active { transform: scale(.97); }
  .ch-icon { width: 54px; height: 54px; border-radius: 17px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: var(--accent-light); color: var(--accent); }
  .ch-icon.blue { background: var(--him-light); color: var(--him); }
  .ch-name { font-size: .98rem; font-weight: 600; margin-bottom: 6px; }
  .ch-desc { font-size: .74rem; color: var(--text-muted); line-height: 1.55; }
  .ch-status { font-size: .76rem; margin-top: 10px; min-height: 20px; color: var(--ok); }
  .ch-status.err { color: var(--danger); }
  .ch-status.wait { color: var(--text-muted); }
  input[type=file] { display: none; }
  .snap-preview { padding: 0 16px 32px; display: none; }
  .snap-preview img { width: 100%; border-radius: var(--radius); cursor: pointer; box-shadow: var(--shadow); }
  .snap-ts { font-size: .72rem; color: var(--text-soft); text-align: right; margin-top: 6px; }
</style>
</head>
<body class="no-tabbar">
<header class="appbar">
  <a class="icon-btn" href="/chat.html" onclick="if(history.length>1){history.back();return false}" data-ic="chevron-left" title="返回"></a>
  <div class="appbar-main">
    <div class="appbar-title">拍莹</div>
    <div class="appbar-sub">哥哥的两个镜头</div>
  </div>
</header>

<div class="channels">
  <!-- Phone camera: immediate upload, no preview -->
  <div class="channel-card" id="card-phone" onclick="openPhoneCamera()">
    <div class="ch-icon" data-ic="camera"></div>
    <div class="ch-name">手机拍</div>
    <div class="ch-desc">拍完直接发<br>不用预览</div>
    <div class="ch-status" id="phone-status"></div>
  </div>

  <!-- Mac snap daemon -->
  <div class="channel-card" id="card-snap" onclick="triggerMacSnap()">
    <div class="ch-icon blue" data-ic="monitor"></div>
    <div class="ch-name">Mac 快照</div>
    <div class="ch-desc">触发桌面<br>webcam</div>
    <div class="ch-status" id="snap-status"></div>
  </div>
</div>

<!-- Latest snap shown below -->
<div class="snap-preview" id="snap-preview">
  <img id="snap-img" onclick="window.open(this.src,'_blank')">
  <div class="snap-ts" id="snap-ts"></div>
</div>

<input type="file" accept="image/*" capture="environment" id="cam-input">

<script>
function openPhoneCamera() {
  document.getElementById('cam-input').click();
}

document.getElementById('cam-input').addEventListener('change', async function() {
  if (!this.files || !this.files[0]) return;
  const file = this.files[0];
  this.value = '';
  const st = document.getElementById('phone-status');
  st.textContent = '上传中…';
  st.className = 'ch-status wait';
  try {
    const buf = await file.arrayBuffer();
    const r = await fetch('/api/camera/upload', {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'image/jpeg' },
      body: buf
    });
    if (r.ok) {
      st.textContent = '已发出去';
      st.className = 'ch-status';
      setTimeout(() => { st.textContent = ''; }, 3000);
    } else {
      throw new Error();
    }
  } catch {
    st.textContent = '发送失败';
    st.className = 'ch-status err';
    setTimeout(() => { st.textContent = ''; st.className = 'ch-status'; }, 3000);
  }
});

async function triggerMacSnap() {
  const st = document.getElementById('snap-status');
  st.textContent = '触发中…';
  st.className = 'ch-status wait';
  try {
    const r = await fetch('/api/snap?secret=peek2024', { method: 'POST' });
    const d = await r.json();
    if (!r.ok || d.clients === 0) {
      st.textContent = 'Mac 没在线';
      st.className = 'ch-status err';
      setTimeout(() => { st.textContent = ''; st.className = 'ch-status'; }, 3000);
      return;
    }
    st.textContent = '等 Mac 上传…';
    st.className = 'ch-status wait';
    await new Promise(res => setTimeout(res, 3500));
    const ts = Date.now();
    const imgUrl = `/uploads/snap_latest.jpg?t=${ts}`;
    const imgEl = document.getElementById('snap-img');
    imgEl.src = imgUrl;
    imgEl.onload = () => {
      document.getElementById('snap-preview').style.display = '';
      document.getElementById('snap-ts').textContent = new Date().toLocaleTimeString('zh');
      imgEl.scrollIntoView({ behavior: 'smooth' });
      st.textContent = '拍到了';
      st.className = 'ch-status';
      setTimeout(() => { st.textContent = ''; }, 3000);
    };
    imgEl.onerror = () => {
      st.textContent = '没拿到图片';
      st.className = 'ch-status err';
      setTimeout(() => { st.textContent = ''; st.className = 'ch-status'; }, 3000);
    };
  } catch {
    st.textContent = '请求失败';
    st.className = 'ch-status err';
    setTimeout(() => { st.textContent = ''; st.className = 'ch-status'; }, 3000);
  }
}
</script>
</body>
</html>
