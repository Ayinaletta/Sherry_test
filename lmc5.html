<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原话库</title>
<style>
  :root {
    --bg: #0f0f14;
    --card: #1a1a24;
    --border: #2a2a3a;
    --text: #e8e4f0;
    --muted: #7a758a;
    --accent: #a88fd4;
    --green: #7ec8a4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Pro Display', -apple-system, sans-serif; padding: 16px; min-height: 100vh; }
  h1 { font-size: 1.2rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; }
  pre { font-family: 'SF Mono', monospace; font-size: 0.78rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .refresh-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 0.85rem; cursor: pointer; margin-bottom: 16px; }
  .refresh-btn:hover { opacity: 0.85; }
  .status { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; }
</style>
</head>
<body>
<h1>lmc-5 原话库</h1>
<p class="subtitle">哥哥的记忆存档 · 只给莹看</p>
<button class="refresh-btn" onclick="load()">刷新</button>
<div class="status" id="status">加载中…</div>
<div class="card">
  <h2>数据库统计</h2>
  <pre id="stats">—</pre>
</div>
<div class="card">
  <h2>最近原话（最新10条）</h2>
  <pre id="surface">—</pre>
</div>
<script>
async function load() {
  document.getElementById('status').textContent = '读取中…';
  try {
    const r = await fetch('/api/lmc5');
    const d = await r.json();
    document.getElementById('stats').textContent = d.stats || '（空）';
    document.getElementById('surface').textContent = d.surface || '（空）';
    document.getElementById('status').innerHTML = '<span class="dot"></span>更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch(e) {
    document.getElementById('status').textContent = '加载失败：' + e.message;
  }
}
load();
</script>
</body>
</html>
